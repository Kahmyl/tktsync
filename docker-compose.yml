services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tktsync
      POSTGRES_PASSWORD: tktsync
      POSTGRES_DB: tktsync
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tktsync -d tktsync']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - tktsync-postgres:/var/lib/postgresql/data

volumes:
  tktsync-postgres:
