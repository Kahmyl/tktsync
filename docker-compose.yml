x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://tktsync:tktsync@postgres:5432/tktsync?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-15s}
  HTTP_LONG_REQUEST_TIMEOUT: ${HTTP_LONG_REQUEST_TIMEOUT:-60s}
  HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
  HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-1048576}
  HTTP_MAX_IN_FLIGHT: ${HTTP_MAX_IN_FLIGHT:-200}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
  DB_TX_MAX_ATTEMPTS: ${DB_TX_MAX_ATTEMPTS:-3}
  DB_TX_RETRY_BASE_DELAY: ${DB_TX_RETRY_BASE_DELAY:-10ms}
  DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
  DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-2}
  DB_MAX_CONNECTION_LIFETIME: ${DB_MAX_CONNECTION_LIFETIME:-30m}
  DB_MAX_CONNECTION_IDLE_TIME: ${DB_MAX_CONNECTION_IDLE_TIME:-5m}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-65s}
  DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-3s}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_JWT_ALGORITHMS: ${SUPABASE_JWT_ALGORITHMS:-ES256,RS256}
  SELECTION_KEYRING_ACTIVE_VERSION: ${SELECTION_KEYRING_ACTIVE_VERSION:-}
  SELECTION_KEYRING_KEYS: ${SELECTION_KEYRING_KEYS:-}
  RESERVATION_KEYRING_ACTIVE_VERSION: ${RESERVATION_KEYRING_ACTIVE_VERSION:-}
  RESERVATION_KEYRING_KEYS: ${RESERVATION_KEYRING_KEYS:-}
  QR_KEYRING_ACTIVE_VERSION: ${QR_KEYRING_ACTIVE_VERSION:-}
  QR_KEYRING_KEYS: ${QR_KEYRING_KEYS:-}
  PARTNER_CREDENTIAL_REPLAY_KEY: ${PARTNER_CREDENTIAL_REPLAY_KEY:-}
  REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
  REALTIME_MAX_CONNECTIONS: ${REALTIME_MAX_CONNECTIONS:-1000}
  REALTIME_CHANNEL_PREFIX: ${REALTIME_CHANNEL_PREFIX:-tktsync}
  WORKER_RESERVATION_CONCURRENCY: ${WORKER_RESERVATION_CONCURRENCY:-2}
  WORKER_OUTBOX_CONCURRENCY: ${WORKER_OUTBOX_CONCURRENCY:-2}
  WORKER_WEBHOOK_CONCURRENCY: ${WORKER_WEBHOOK_CONCURRENCY:-4}
  WORKER_RESERVATION_BATCH_SIZE: ${WORKER_RESERVATION_BATCH_SIZE:-100}
  WORKER_OUTBOX_BATCH_SIZE: ${WORKER_OUTBOX_BATCH_SIZE:-100}
  WORKER_WEBHOOK_BATCH_SIZE: ${WORKER_WEBHOOK_BATCH_SIZE:-50}
  WORKER_WEBHOOK_TIMEOUT: ${WORKER_WEBHOOK_TIMEOUT:-5s}
  WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
  WEBHOOK_ENCRYPTION_KEY_VERSION: ${WEBHOOK_ENCRYPTION_KEY_VERSION:-}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
  WEBHOOK_ENCRYPTION_KEYRING: ${WEBHOOK_ENCRYPTION_KEYRING:-}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
  SELECTOR_BASE_URL: ${SELECTOR_BASE_URL:-http://localhost:${SELECTOR_HOST_PORT:-54471}/s}
  TICKET_QR_PUBLIC_BASE_URL: ${TICKET_QR_PUBLIC_BASE_URL:-http://localhost:${API_HOST_PORT:-58480}}
  BROWSER_ALLOWED_ORIGINS: ${BROWSER_ALLOWED_ORIGINS:-http://localhost:${ADMIN_HOST_PORT:-54470},http://localhost:${SELECTOR_HOST_PORT:-54471},http://localhost:${SCANNER_HOST_PORT:-54472}}

x-frontend-build: &frontend-build
  context: .
  dockerfile: Dockerfile.frontend
  args: &frontend-build-args
    VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_HOST_PORT:-58480}}
    VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
    VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    VITE_BROWSER_TELEMETRY_ENDPOINT: ${VITE_BROWSER_TELEMETRY_ENDPOINT:-}
    VITE_ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:${ADMIN_HOST_PORT:-54470}}
    VITE_PARTNER_DEMO_PUBLIC_URL: ${PARTNER_DEMO_PUBLIC_URL:-http://localhost:${PARTNER_DEMO_HOST_PORT:-54474}}
    VITE_SELECTOR_PUBLIC_URL: ${SELECTOR_PUBLIC_URL:-http://localhost:${SELECTOR_HOST_PORT:-54471}}
    VITE_SCANNER_PUBLIC_URL: ${SCANNER_PUBLIC_URL:-http://localhost:${SCANNER_HOST_PORT:-54472}}
    VITE_DOCS_PUBLIC_URL: ${DOCS_PUBLIC_URL:-http://localhost:${DOCS_HOST_PORT:-54473}}
    VITE_SOURCE_URL: ${SOURCE_URL:-https://github.com/Kahmyl/tktsync}
    VITE_ARCHITECTURE_URL: ${ARCHITECTURE_URL:-https://github.com/Kahmyl/tktsync/tree/main/docs/architecture}
    VITE_SECURITY_URL: ${SECURITY_URL:-https://github.com/Kahmyl/tktsync/blob/main/docs/architecture/security.md}
    VITE_RUNTIME_URL: ${RUNTIME_URL:-https://github.com/Kahmyl/tktsync/blob/main/docs/operations/runtime-model.md}
    VITE_REVIEW_ACCESS_LABEL: ${REVIEW_ACCESS_LABEL:-}
    VITE_REVIEW_ACCESS_EMAIL: ${REVIEW_ACCESS_EMAIL:-}
    VITE_REVIEW_ACCESS_PASSWORD: ${REVIEW_ACCESS_PASSWORD:-}
    VITE_REVIEW_ACCESS_INSTRUCTIONS: ${REVIEW_ACCESS_INSTRUCTIONS:-}

x-frontend-healthcheck: &frontend-healthcheck
  test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
  interval: 10s
  start_interval: 1s
  timeout: 2s
  retries: 15
  start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tktsync
      POSTGRES_PASSWORD: tktsync
      POSTGRES_DB: tktsync
    ports:
      - ${POSTGRES_PORT:-55439}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tktsync -d tktsync']
      interval: 5s
      start_interval: 1s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://tktsync:tktsync@postgres:5432/tktsync?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: no
    volumes:
      - ./migrations:/migrations:ro

  seed:
    image: postgres:17-alpine
    command: [sh, /scripts/seed-local.sh]
    environment:
      DATABASE_URL: postgres://tktsync:tktsync@postgres:5432/tktsync?sslmode=disable
      LOCAL_OPERATOR_AUTH_SUBJECT: ${LOCAL_OPERATOR_AUTH_SUBJECT:-}
      LOCAL_OPERATOR_DISPLAY_NAME: ${LOCAL_OPERATOR_DISPLAY_NAME:-Local Platform Admin}
      LOCAL_OPERATOR_PLATFORM_ADMIN: ${LOCAL_OPERATOR_PLATFORM_ADMIN:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: no
    volumes:
      - ./seeds:/seeds:ro
      - ./scripts/seed-local.sh:/scripts/seed-local.sh:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *backend-environment
      API_HOST: 0.0.0.0
      API_PORT: 8080
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ADMIN_INVITE_REDIRECT_URL: ${ADMIN_INVITE_REDIRECT_URL:-http://localhost:${ADMIN_HOST_PORT:-54470}/set-password}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - ${API_HOST_PORT:-58480}:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/ready]
      interval: 10s
      start_interval: 1s
      timeout: 2s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s
    restart: no

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend-environment
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-10s}
    depends_on:
      seed:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: no

  admin:
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        APP_PACKAGE: '@tktsync/admin-web'
        APP_DIRECTORY: admin-web
    ports:
      - ${ADMIN_HOST_PORT:-54470}:8080
    healthcheck: *frontend-healthcheck
    restart: no

  selector:
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        APP_PACKAGE: '@tktsync/selector-web'
        APP_DIRECTORY: selector-web
    ports:
      - ${SELECTOR_HOST_PORT:-54471}:8080
    healthcheck: *frontend-healthcheck
    restart: no

  scanner:
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        APP_PACKAGE: '@tktsync/scanner-web'
        APP_DIRECTORY: scanner-web
    ports:
      - ${SCANNER_HOST_PORT:-54472}:8080
    healthcheck: *frontend-healthcheck
    restart: no

  docs:
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        APP_PACKAGE: '@tktsync/docs-web'
        APP_DIRECTORY: docs-web
        NGINX_CONFIG: nginx-docs.conf
        VITE_DOCS_LOCAL_API_BASE_URL: ${DOCS_LOCAL_API_BASE_URL:-http://localhost:${API_HOST_PORT:-58480}}
        VITE_DOCS_SANDBOX_API_BASE_URL: ${DOCS_SANDBOX_API_BASE_URL:-}
        VITE_DOCS_PRODUCTION_API_BASE_URL: ${DOCS_PRODUCTION_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${DOCS_HOST_PORT:-54473}:8080
    healthcheck: *frontend-healthcheck
    restart: no

  partner-demo:
    build:
      context: .
      dockerfile: Dockerfile.partner-demo
    environment:
      PORT: 8080
      API_PUBLIC_URL: http://api:8080
      PARTNER_DEMO_PUBLIC_URL: ${PARTNER_DEMO_PUBLIC_URL:-http://localhost:${PARTNER_DEMO_HOST_PORT:-54474}}
      PARTNER_DEMO_RETURN_URL: ${PARTNER_DEMO_RETURN_URL:-http://localhost:${PARTNER_DEMO_HOST_PORT:-54474}/checkout/return}
      PARTNER_DEMO_CREDENTIAL: ${PARTNER_DEMO_CREDENTIAL:-}
      PARTNER_DEMO_SESSION_SECRET: ${PARTNER_DEMO_SESSION_SECRET:-local-review-session-secret}
      SCANNER_PUBLIC_URL: ${SCANNER_PUBLIC_URL:-http://localhost:${SCANNER_HOST_PORT:-54472}}
      REVIEWER_PUBLIC_URL: ${REVIEWER_PUBLIC_URL:-http://localhost:${REVIEWER_HOST_PORT:-54475}}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${PARTNER_DEMO_HOST_PORT:-54474}:8080
    healthcheck: *frontend-healthcheck
    restart: no

  reviewer:
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        APP_PACKAGE: '@tktsync/reviewer-web'
        APP_DIRECTORY: reviewer-web
    ports:
      - ${REVIEWER_HOST_PORT:-54475}:8080
    healthcheck: *frontend-healthcheck
    restart: no

volumes:
  postgres-data:
