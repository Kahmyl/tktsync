worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
      access_log off;
      return 204;
    }

    # Fixed same-origin execution boundary. It cannot proxy Admin, Scanner,
    # Selection, Admission, arbitrary hosts, or arbitrary API paths.
    location ^~ /__docs-exec/api/v1/partner/ {
      access_log off;
      client_max_body_size 1m;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 65s;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_pass_request_headers on;
      proxy_set_header Host api:8080;
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Cache-Control "no-store" always;
      rewrite ^/__docs-exec(/api/v1/partner/.*)$ $1 break;
      proxy_pass http://api:8080;
    }

    location ^~ /__docs-exec/ {
      access_log off;
      return 404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
