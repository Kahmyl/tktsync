name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/tktsync-api ./cmd/api
      - run: go build -o /tmp/tktsync-worker ./cmd/worker

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm api:routes
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm format:check
      - run: node scripts/check-release-contract.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tktsync
          POSTGRES_PASSWORD: tktsync
          POSTGRES_DB: tktsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tktsync -d tktsync"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: |
          docker run --rm --network host \
            -v "$PWD/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path=/migrations \
            -database "postgres://tktsync:tktsync@localhost:5432/tktsync?sslmode=disable" \
            up
      - run: |
          docker run --rm --network host \
            -e PGPASSWORD=tktsync \
            postgres:17-alpine \
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -U tktsync \
              -d tktsync \
              -c "SELECT 1 / CASE WHEN COUNT(*)=1 THEN 1 ELSE 0 END FROM schema_migrations WHERE version=7 AND dirty=false"
      - run: ./scripts/certify-partner-integration.sh
        env:
          POSTGRES_PORT: 5432
          DATABASE_URL: postgres://tktsync:tktsync@localhost:5432/tktsync?sslmode=disable
      - run: |
          cd backend
          go test -tags=integration \
            ./internal/adminapi \
            ./internal/platform/database \
            ./internal/reservation \
            -run '^(TestAdminLifecycleAuthorizationReasonAuditAndIdempotency|TestRunnerRetriesAnActualPostgreSQLDeadlock|TestReporting.*|TestSelection.*|TestAdmission.*|TestHoldVersusBlockHasOneAuthoritativeWinner|TestPartnerDisableVersusAcquisitionUsesPartnerGate|TestConfirmationVersusCancellationOrdering|TestConfirmationExpiryGuardUsesPostLockDatabaseTime|TestCancellationCleanupIsBoundedAndStateAware|TestVoidAndReissueVersusScanOrdering)$' \
            -count=1
        env:
          DATABASE_URL: postgres://tktsync:tktsync@localhost:5432/tktsync?sslmode=disable

  release-gate:
    runs-on: ubuntu-latest
    needs:
      - backend-static
      - frontend-contract
      - postgres-integration
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - run: echo "TktSync release gate complete."
